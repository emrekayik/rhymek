[project]
name = "rhymek"
version = "0.1.0"
description = "A Python library for Natural Language Processing (NLP) for Turkish Songs."
readme = "README.md"
authors = [
    { name = "emrekayik", email = "emrekayik1905@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "lyricsgenius>=3.18.1",
    "nltk>=3.10.4",
    "polars>=2.1.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "turkishnlp>=0.0.61",
    "typer>=0.29.2",
]

[project.scripts]
rhymek = "rhymek:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
